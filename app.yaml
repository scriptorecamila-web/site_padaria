runtime: python313
entrypoint: gunicorn --bind :$PORT nucleo.wsgi:application

instance_class: F1
automatic_scaling:
  min_instances: 0
  max_instances: 2

handlers:
  - url: /static
    static_dir: staticfiles
    secure: always
  - url: /.*
    script: auto
    secure: always

env_variables:
  DEBUG: "False"
  ALLOWED_HOSTS: ".r.appspot.com,.appspot.com"
