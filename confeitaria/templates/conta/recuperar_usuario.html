{% extends "confeitaria/base.html" %}
{% block titulo %}Recuperar usuário{% endblock %}
{% block conteudo %}
    <div class="cartao">
        <h1>Recuperar usuário</h1>
        <p>Informe o e-mail cadastrado. Se houver uma conta ativa, enviaremos o nome de usuário.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="botao">Enviar instruções</button>
        </form>
        <p><a class="link-simples" href="{% url 'confeitaria:entrar' %}">Voltar para entrar</a></p>
    </div>
{% endblock %}
