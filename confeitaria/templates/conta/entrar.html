{% extends "confeitaria/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
    <div class="cartao">
        <h1>Entrar</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="botao">Entrar</button>
        </form>
        <p><a class="link-simples" href="{% url 'confeitaria:recuperar_senha' %}">Esqueci minha senha</a></p>
        <p><a class="link-simples" href="{% url 'confeitaria:recuperar_usuario' %}">Esqueci meu usuário</a></p>
    </div>
{% endblock %}
