{% extends "base.html" %}
{% block titulo %}Movimento de estoque{% endblock %}
{% block conteudo %}
    <div class="cartao">
        <h1>Registrar movimento</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="botao">Salvar</button>
            <a href="{% url 'confeitaria:estoque_lista' %}" class="botao secundario">Cancelar</a>
        </form>
    </div>
{% endblock %}
