{% extends "base.html" %}
{% block titulo %}Excluir Pedido{% endblock %}
{% block conteudo %}
    <div class="cartao">
        <h1>Excluir pedido de "{{ object.produto.nome }}"?</h1>
        <form method="post" class="form-exclusao">
            {% csrf_token %}
            <button type="submit" class="botao">Confirmar exclusão</button>
            <a href="{% url 'confeitaria:pedido_lista' %}" class="botao secundario">Cancelar</a>
        </form>
    </div>
{% endblock %}
