{% extends "confeitaria/base.html" %}
{% block titulo %}{% if object %}Editar Produto{% else %}Novo Produto{% endif %}{% endblock %}
{% block conteudo %}
    <div class="cartao">
        <h1>{% if object %}Editar Produto{% else %}Novo Produto{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="botao">Salvar</button>
        </form>
    </div>
{% endblock %}
