{% extends "base.html" %}
{% block titulo %}Excluir Produto{% endblock %}
{% block conteudo %}
    <div class="cartao">
        <h1>Excluir "{{ object.nome }}"?</h1>
        <form method="post" class="form-exclusao">
            {% csrf_token %}
            <button type="submit" class="botao">Confirmar exclusão</button>
            <a href="{% url 'confeitaria:produto_lista' %}" class="botao secundario">Cancelar</a>
        </form>
    </div>
{% endblock %}
